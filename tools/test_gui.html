<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HostageTarget Test</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  button { font-size: 18px; padding: 12px 16px; margin: 4px; min-width: 90px; }
  .row { margin: 16px 0; }
  input[type=range] { width: 70%; vertical-align: middle; }
  #status { font-family: monospace; color: #333; margin-left: 8px; }
  hr { margin: 20px 0; }
</style>
</head>
<body>
<h1>HostageTarget &mdash; Test</h1>

<button id="connect">Verbinden</button>
<span id="status">nicht verbunden</span>

<div class="row">
  <label>X (mm): <input type="range" id="x" min="-200" max="200" value="0" step="1"></label>
  <span id="xval">0</span>
</div>
<div class="row">
  <label>Y (mm): <input type="range" id="y" min="-210" max="210" value="170" step="1"></label>
  <span id="yval">170</span>
</div>
<div class="row">
  <button id="send">MOVE (weich)</button>
  <button id="snap">MOVE (Sprung)</button>
</div>

<hr>
<div>
  <!-- Links/Rechts/Versteckt sind IK-Presets. "Beide oben" ist die Montage-Referenz
       (beide Kurbeln senkrecht nach oben, theta = 90°). -->
  <button data-cmd="PEEK left"  data-x="-50" data-y="150">Links</button>
  <button data-cmd="PEEK right" data-x="50"  data-y="150">Rechts</button>
  <button data-cmd="PEEK top">Beide oben</button>
  <button data-cmd="PEEK hide"  data-x="0"   data-y="170">Versteckt</button>
  <button id="stop">STOP</button>
</div>

<hr>
<div>
  <h3>Direkte Servo-Steuerung (RAW, voller 270°-Bereich)</h3>
  <div class="row">
    <label>Servo L (µs): <input type="range" id="rawL" min="500" max="2500" value="1500" step="10"></label>
    <span id="rawLval">1500</span>
  </div>
  <div class="row">
    <label>Servo R (µs): <input type="range" id="rawR" min="500" max="2500" value="1500" step="10"></label>
    <span id="rawRval">1500</span>
  </div>
  <div class="row">
    <button id="rawSend">RAW senden</button>
    <span style="color:#666">Setzt beide Servos direkt auf die gewählten Pulsbreiten (500–2500 µs).</span>
  </div>
</div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // schreiben (Handy -> ESP)
const TX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // empfangen (ESP -> Handy)

let rxChar = null;
let txChar = null;

const status = document.getElementById('status');
const xSlider = document.getElementById('x');
const ySlider = document.getElementById('y');

xSlider.oninput = () => document.getElementById('xval').textContent = xSlider.value;
ySlider.oninput = () => document.getElementById('yval').textContent = ySlider.value;

function send(line) {
  if (!rxChar) { status.textContent = 'Erst verbinden!'; return; }
  rxChar.writeValue(new TextEncoder().encode(line + '\n'));
}

async function connect() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    rxChar = await service.getCharacteristic(RX_UUID);
    txChar = await service.getCharacteristic(TX_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', (e) => {
      const text = new TextDecoder().decode(e.target.value);
      status.textContent = 'RX: ' + text.trim();
    });
    status.textContent = 'verbunden';
  } catch (err) {
    status.textContent = 'Fehler: ' + err;
  }
}

function setSliders(x, y) {
  xSlider.value = x;
  ySlider.value = y;
  document.getElementById('xval').textContent = x;
  document.getElementById('yval').textContent = y;
}

document.getElementById('connect').onclick = connect;
document.getElementById('send').onclick = () => send(`MOVE ${xSlider.value} ${ySlider.value}`);
document.getElementById('snap').onclick = () => send(`MOVE ${xSlider.value} ${ySlider.value} snap`);
document.getElementById('stop').onclick = () => { setSliders(0, 170); send('STOP'); };
document.querySelectorAll('button[data-cmd]').forEach(b => {
  b.onclick = () => {
    if (b.dataset.x !== undefined && b.dataset.y !== undefined) {
      setSliders(b.dataset.x, b.dataset.y);
    }
    send(b.dataset.cmd);
  };
});

const rawLSlider = document.getElementById('rawL');
const rawRSlider = document.getElementById('rawR');
rawLSlider.oninput = () => document.getElementById('rawLval').textContent = rawLSlider.value;
rawRSlider.oninput = () => document.getElementById('rawRval').textContent = rawRSlider.value;

function sendRaw() {
  send(`RAW ${rawLSlider.value} ${rawRSlider.value}`);
}
rawLSlider.onchange = sendRaw;
rawRSlider.onchange = sendRaw;
document.getElementById('rawSend').onclick = sendRaw;
</script>
</body>
</html>
