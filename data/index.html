<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrabGeist</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
  #status { font-family: monospace; font-size: .85rem; color: #333; min-height: 1.2em; }
  button { padding: .45rem .7rem; margin: .2rem; cursor: pointer; }
  .row { margin: .6rem 0; }
  .hint { color: #666; font-size: .82rem; }
  #map { border: 1px solid #333; width: 100%; max-width: 460px; image-rendering: pixelated; touch-action: none; }
  section { border-top: 1px solid #ddd; margin-top: 1rem; padding-top: .4rem; }
  .step { border: 1px solid #eee; border-radius: 6px; padding: .4rem .5rem; margin: .3rem 0; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .steptype { font-weight: bold; min-width: 3.5rem; color: #555; }
  .step label { font-size: .85rem; }
  .step input[type=number] { width: 4rem; }
  input[type=range] { vertical-align: middle; }
</style>
</head>
<body>
<h1>GrabGeist</h1>
<div id="status">verbinde …</div>

<section id="live">
  <h2>Live-Steuerung</h2>
  <canvas id="map"></canvas>
  <p class="hint">Tippe auf die Karte (grün = erreichbar).</p>
  <div class="row">
    <button data-peek="left">Links</button>
    <button data-peek="right">Rechts</button>
    <button data-peek="top">Oben</button>
    <button data-peek="hide">Versteckt</button>
    <button id="stop">STOP</button>
    <button id="random">Zufall</button>
  </div>
  <div class="row">
    <label>Geschwindigkeit (%): <input type="range" id="speed" min="0" max="100" value="100"> <span id="speedVal">100</span></label>
  </div>
  <div class="row">
    <label>Strombegrenzung (&micro;s/s): <input type="range" id="ramp" min="100" max="3400" step="50" value="1000"> <span id="rampVal">1000</span></label>
  </div>
</section>

<section id="sequence">
  <h2>Ablauf (Programm)</h2>
  <div class="row">
    <label>Name: <input id="seqName" placeholder="Meine Show"></label>
    <label><input type="checkbox" id="seqLoop" checked> Schleife</label>
  </div>
  <div class="row">
    <button id="seqLoad">Laden</button>
    <button id="seqSave">Speichern</button>
    <button id="seqExport">Export</button>
    <button id="seqImport">Import</button>
    <input type="file" id="seqFile" accept=".json" hidden>
    <button id="seqRun">Abspielen</button>
  </div>
  <div id="steps"></div>
  <div class="row">
    <button id="addMove">+ Move</button>
    <button id="addPreset">+ Preset</button>
    <button id="addDelay">+ Delay</button>
    <button id="addWait">+ Wait</button>
  </div>
  <p class="hint">Move = X/Y-Punkt &middot; Preset = links/rechts/versteckt &middot; Delay = ms warten &middot; Wait = bis Bewegung fertig.</p>
</section>
<script>
const $ = (id) => document.getElementById(id);
const status = $('status');
const mapCanvas = $('map');
const mapCtx = mapCanvas.getContext('2d');

let mapInfo = null;
let seq = { version: 1, name: '', loop: true, steps: [] };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + ' -> HTTP ' + r.status);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}
function post(path, body) {
  return api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
}
const err = (e) => { status.textContent = 'Fehler: ' + e; };

async function loadMap() {
  mapInfo = await api('/api/map');
  mapCanvas.width = mapInfo.w;
  mapCanvas.height = mapInfo.h;
  const img = mapCtx.createImageData(mapInfo.w, mapInfo.h);
  for (let cy = 0; cy < mapInfo.h; cy++) {
    const row = mapInfo.rows[cy] || '';
    for (let cx = 0; cx < mapInfo.w; cx++) {
      const valid = cx < row.length && row[cx] === '1';
      const i = (cy * mapInfo.w + cx) * 4;
      img.data[i] = 0; img.data[i + 1] = valid ? 150 : 35; img.data[i + 2] = 0; img.data[i + 3] = 255;
    }
  }
  mapCtx.putImageData(img, 0, 0);
}
mapCanvas.addEventListener('click', (e) => {
  if (!mapInfo) return;
  const rect = mapCanvas.getBoundingClientRect();
  const px = Math.floor((e.clientX - rect.left) / rect.width * mapInfo.w);
  const py = Math.floor((e.clientY - rect.top) / rect.height * mapInfo.h);
  const cx = Math.max(0, Math.min(mapInfo.w - 1, px));
  const cy = Math.max(0, Math.min(mapInfo.h - 1, mapInfo.h - 1 - py));
  const x = Math.round(mapInfo.xMin + cx * mapInfo.step);
  const y = Math.round(mapInfo.yMin + cy * mapInfo.step);
  post('/api/move', { x, y, snap: false }).catch(err);
});

document.querySelectorAll('button[data-peek]').forEach(b => {
  b.onclick = () => post('/api/peek', { target: b.dataset.peek }).catch(err);
});
$('stop').onclick = () => post('/api/stop').catch(err);
$('random').onclick = () => post('/api/random', { enabled: true }).catch(err);

const speedSlider = $('speed'), rampSlider = $('ramp');
speedSlider.oninput = () => $('speedVal').textContent = speedSlider.value;
speedSlider.onchange = () => post('/api/speed', { percent: +speedSlider.value }).catch(err);
rampSlider.oninput = () => $('rampVal').textContent = rampSlider.value;
rampSlider.onchange = () => post('/api/ramp', { usPerSec: +rampSlider.value }).catch(err);

async function pollStatus() {
  try {
    const st = await api('/api/status');
    status.textContent =
      'x=' + Math.round(st.x) + ' y=' + Math.round(st.y) +
      ' &middot; Speed ' + st.speed + '%' +
      ' &middot; Limit ' + st.ramp + ' &micro;s/s' +
      (st.moving ? ' &middot; f&auml;hrt' : ' &middot; steht') +
      (st.seq ? ' &middot; Ablauf l&auml;uft' : '') +
      (st.random ? ' &middot; Zufall an' : '');
    if (document.activeElement !== speedSlider) { speedSlider.value = st.speed; $('speedVal').textContent = st.speed; }
    if (document.activeElement !== rampSlider) { rampSlider.value = st.ramp; $('rampVal').textContent = st.ramp; }
  } catch (e) {}
}
function renderSteps() {
  const el = $('steps');
  el.innerHTML = '';
  if (!seq.steps || seq.steps.length === 0) {
    el.innerHTML = '<p class="hint">Noch keine Schritte.</p>';
    return;
  }
  seq.steps.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'step';
    let fields = '';
    if (s.type === 'move') {
      fields =
        '<label>X <input type="number" step="5" data-idx="' + i + '" data-f="x" value="' + s.x + '"></label>' +
        '<label>Y <input type="number" step="5" data-idx="' + i + '" data-f="y" value="' + s.y + '"></label>' +
        '<label>Speed <input type="range" min="0" max="100" data-idx="' + i + '" data-f="speed" value="' + s.speed + '"><span>' + s.speed + '%</span></label>';
    } else if (s.type === 'preset') {
      const opts = ['left', 'right', 'hide'].map(n => '<option' + (s.name === n ? ' selected' : '') + '>' + n + '</option>').join('');
      fields =
        '<label><select data-idx="' + i + '" data-f="name">' + opts + '</select></label>' +
        '<label>Speed <input type="range" min="0" max="100" data-idx="' + i + '" data-f="speed" value="' + s.speed + '"><span>' + s.speed + '%</span></label>';
    } else if (s.type === 'delay') {
      fields = '<label>ms <input type="number" step="100" data-idx="' + i + '" data-f="ms" value="' + s.ms + '"></label>';
    } else {
      fields = '<span class="hint">wartet bis Bewegung fertig</span>';
    }
    row.innerHTML =
      '<span class="steptype">' + s.type + '</span>' + fields +
      '<button data-act="up" data-idx="' + i + '">&uarr;</button>' +
      '<button data-act="down" data-idx="' + i + '">&darr;</button>' +
      '<button data-act="del" data-idx="' + i + '">&times;</button>';
    el.appendChild(row);
  });
}

$('steps').addEventListener('input', (e) => {
  const idx = +e.target.dataset.idx;
  const f = e.target.dataset.f;
  if (isNaN(idx) || !f) return;
  const s = seq.steps[idx];
  if (f === 'speed') { s.speed = +e.target.value; e.target.nextElementSibling.textContent = s.speed + '%'; }
  else if (f === 'ms') { s.ms = +e.target.value || 0; }
  else if (f === 'name') { s.name = e.target.value; }
  else { s[f] = parseFloat(e.target.value) || 0; }
});

$('steps').addEventListener('click', (e) => {
  const act = e.target.dataset.act;
  const idx = +e.target.dataset.idx;
  if (act === 'del') { seq.steps.splice(idx, 1); renderSteps(); }
  else if (act === 'up' && idx > 0) { [seq.steps[idx - 1], seq.steps[idx]] = [seq.steps[idx], seq.steps[idx - 1]]; renderSteps(); }
  else if (act === 'down' && idx < seq.steps.length - 1) { [seq.steps[idx + 1], seq.steps[idx]] = [seq.steps[idx], seq.steps[idx + 1]]; renderSteps(); }
});

$('addMove').onclick = () => { seq.steps.push({ type: 'move', x: 0, y: 160, speed: 100 }); renderSteps(); };
$('addPreset').onclick = () => { seq.steps.push({ type: 'preset', name: 'hide', speed: 100 }); renderSteps(); };
$('addDelay').onclick = () => { seq.steps.push({ type: 'delay', ms: 1000 }); renderSteps(); };
$('addWait').onclick = () => { seq.steps.push({ type: 'wait' }); renderSteps(); };

$('seqName').oninput = () => { seq.name = $('seqName').value; };
$('seqLoop').onchange = () => { seq.loop = $('seqLoop').checked; };

$('seqSave').onclick = () => post('/api/sequence', seq).then(() => status.textContent = 'Ablauf gespeichert.').catch(err);
$('seqLoad').onclick = async () => {
  try { seq = await api('/api/sequence'); $('seqName').value = seq.name || ''; $('seqLoop').checked = !!seq.loop; renderSteps(); status.textContent = 'Ablauf geladen.'; }
  catch (e) { err(e); }
};
$('seqExport').onclick = () => {
  const blob = new Blob([JSON.stringify(seq, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (seq.name || 'ablauf') + '.json';
  a.click();
};
$('seqImport').onclick = () => $('seqFile').click();
$('seqFile').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    seq = JSON.parse(await f.text());
    if (!seq.steps) seq.steps = [];
    $('seqName').value = seq.name || '';
    $('seqLoop').checked = !!seq.loop;
    renderSteps();
    status.textContent = 'Ablauf importiert.';
  } catch (e2) { err(e2); }
};
$('seqRun').onclick = async () => {
  try { await post('/api/sequence', seq); await post('/api/run'); status.textContent = 'Ablauf gestartet.'; }
  catch (e) { err(e); }
};

(async function init() {
  try {
    await loadMap();
    seq = await api('/api/sequence');
    $('seqName').value = seq.name || '';
    $('seqLoop').checked = !!seq.loop;
    renderSteps();
  } catch (e) { status.textContent = 'Nicht verbunden: ' + e; }
  setInterval(pollStatus, 1500);
  pollStatus();
})();
</script>
</body>
</html>
